<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10251f">
  <title>無限豐盛帳本｜Universe Ledger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg: #0d1c18;
      --surface: #142923;
      --surface-2: #1b342c;
      --line: rgba(222,235,225,.12);
      --text: #edf3ed;
      --muted: #a4b6aa;
      --soft: #718b7b;
      --mint: #a6d7c2;
      --gold: #d9c28a;
      --input: #10231d;
      --danger: #e7a3a0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: var(--text);
      background: radial-gradient(ellipse at 80% 0%, #1c3a2e 0, transparent 36%), var(--bg);
      font-family: "Plus Jakarta Sans", "Noto Serif TC", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .app { width: min(100% - 32px, 560px); margin: 0 auto; padding: 28px 0 36px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:24px; }
    .brand { display:flex; align-items:center; gap:12px; min-width:0; }
    .brand-mark { width:42px; height:42px; display:grid; place-items:center; border:1px solid #456456; background:#1c382e; color:var(--mint); border-radius:15px; flex-shrink:0; }
    .eyebrow { color:var(--mint); font-size:10px; letter-spacing:.16em; text-transform:uppercase; margin:0 0 4px; }
    h1 { font:500 20px/1.35 "Noto Serif TC", serif; margin:0; letter-spacing:.02em; }
    .header-note { color:var(--muted); font-size:12px; white-space:nowrap; }
    .panel { background:rgba(20,41,35,.94); border:1px solid var(--line); border-radius:22px; padding:22px; margin-bottom:16px; box-shadow:0 14px 36px rgba(0,0,0,.12); }
    .balance { position:relative; overflow:hidden; background:linear-gradient(135deg, #1b382e, #142923 76%); }
    .balance:after { content:""; position:absolute; width:180px; height:180px; border:1px solid rgba(166,215,194,.08); border-radius:50%; right:-75px; top:-95px; box-shadow:0 0 0 22px rgba(166,215,194,.025),0 0 0 46px rgba(166,215,194,.02); pointer-events:none; }
    .section-label { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:12px; }
    .section-label svg { width:15px; height:15px; color:var(--mint); }
    .amount { font:500 clamp(32px,8vw,43px)/1.25 "Plus Jakarta Sans",sans-serif; letter-spacing:-.045em; color:var(--gold); margin:13px 0 6px; overflow-wrap:anywhere; }
    .quote { margin:0; color:#b8c9be; font-size:12px; line-height:1.7; max-width:390px; }
    .stats { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:22px; }
    .stat { background:rgba(6,20,15,.25); border:1px solid var(--line); border-radius:14px; padding:13px 15px; }
    .stat small { display:block; color:var(--muted); font-size:11px; margin-bottom:7px; }
    .stat strong { font-size:17px; font-weight:600; }
    .section-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; }
    h2 { font:500 17px/1.4 "Noto Serif TC",serif; margin:0; }
    .section-sub { color:var(--muted); font-size:11px; margin:5px 0 0; }
    .field { margin-bottom:14px; }
    label { display:block; color:#b9c9bf; font-size:12px; margin-bottom:7px; }
    input, select {
      width:100%; min-height:48px; border:1px solid #304b3f; background:var(--input);
      color:var(--text); border-radius:13px; padding:12px 14px; outline:none; font-size:14px;
      transition:border-color .2s, box-shadow .2s;
    }
    input::placeholder { color:#6f887a; }
    input:focus, select:focus { border-color:var(--mint); box-shadow:0 0 0 3px rgba(166,215,194,.1); }
    .two-col { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .primary {
      width:100%; display:flex; justify-content:center; align-items:center; gap:9px;
      min-height:50px; border:0; border-radius:14px; margin-top:5px;
      background:var(--mint); color:#10251d; font-weight:700; font-size:14px;
      transition:transform .15s, background .2s;
    }
    .primary:hover { background:#bce4d2; transform:translateY(-1px); }
    .primary:active { transform:scale(.99); }
    .history-head { align-items:flex-start; }
    .text-button { background:transparent; border:1px solid var(--line); color:var(--muted); padding:8px 11px; border-radius:10px; font-size:11px; }
    .text-button:hover { color:var(--danger); border-color:rgba(231,163,160,.4); }
    .history-list { display:grid; gap:10px; }
    .transaction { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:14px; background:#10231d; border:1px solid var(--line); border-radius:15px; }
    .tx-main { min-width:0; }
    .tx-title-row { display:flex; flex-wrap:wrap; align-items:center; gap:7px; margin-bottom:6px; }
    .tx-title { font-size:14px; font-weight:600; overflow-wrap:anywhere; }
    .tag { background:rgba(166,215,194,.12); color:var(--mint); border-radius:6px; padding:3px 7px; font-size:10px; white-space:nowrap; }
    .tx-gratitude { color:var(--muted); font-size:12px; line-height:1.6; margin:0 0 7px; overflow-wrap:anywhere; }
    .tx-date { color:#71877b; font-size:10px; }
    .tx-right { display:flex; align-items:flex-end; gap:8px; flex-shrink:0; text-align:right; }
    .tx-original { color:#789083; font-size:10px; text-decoration:line-through; margin-bottom:4px; }
    .tx-value { color:var(--gold); font-size:14px; font-weight:700; white-space:nowrap; }
    .delete-btn { border:0; background:transparent; color:#688174; padding:4px; }
    .delete-btn:hover { color:var(--danger); }
    .empty { color:var(--muted); text-align:center; padding:30px 12px; border:1px dashed #304b3f; border-radius:15px; font-size:12px; line-height:1.8; }
    footer { text-align:center; color:#6f887a; font-size:11px; line-height:1.8; padding:10px 12px 0; }
    .toast { position:fixed; left:50%; bottom:24px; transform:translate(-50%, 120px); opacity:0; transition:all .3s; z-index:10; max-width:calc(100% - 32px); background:#d8eee2; color:#123126; padding:13px 18px; border-radius:14px; box-shadow:0 12px 35px #0005; font-size:13px; font-weight:600; text-align:center; }
    .toast.show { transform:translate(-50%,0); opacity:1; }
    @media (max-width:420px) {
      .app { width:min(100% - 22px,560px); padding-top:20px; }
      .panel { padding:18px; border-radius:19px; }
      .header-note { display:none; }
      .two-col { grid-template-columns:1fr; gap:0; }
      .transaction { padding:12px; }
      .tx-right { gap:4px; }
    }
    @media (prefers-reduced-motion: reduce) { *,*:before,*:after { animation:none!important; transition:none!important; } }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <div class="brand-mark"><i data-lucide="sprout"></i></div>
        <div>
          <p class="eyebrow">UNIVERSE LEDGER</p>
          <h1>無限豐盛帳本</h1>
        </div>
      </div>
      <div class="header-note">記下流動，也記得感謝</div>
    </header>

    <main>
      <section class="panel balance">
        <div class="section-label"><i data-lucide="orbit"></i> 宇宙迴流總額</div>
        <div class="amount" id="totalAbundance">NT$ 0</div>
        <p class="quote" id="abundanceQuote">每一筆支出，都是你體驗美好生活的印記。</p>
        <div class="stats">
          <div class="stat"><small>豐盛足跡</small><strong id="statCount">0 筆</strong></div>
          <div class="stat"><small>今日提醒</small><strong style="color:var(--mint)">感謝正在流動</strong></div>
        </div>
      </section>

      <section class="panel">
        <div class="section-head">
          <div>
            <h2>記錄一筆流動</h2>
            <p class="section-sub">記下花費，也記下它帶來的美好。</p>
          </div>
          <i data-lucide="plus-circle" style="color:var(--mint);width:20px;height:20px"></i>
        </div>
        <form id="abundanceForm" onsubmit="handleAddTransaction(event)">
          <div class="field">
            <label for="itemTitle">項目 / 體驗</label>
            <input type="text" id="itemTitle" required maxlength="120" placeholder="例如：一杯咖啡、一本書">
          </div>
          <div class="two-col">
            <div class="field">
              <label for="itemAmount">實際支出（NT$）</label>
              <input type="number" id="itemAmount" required min="1" step="1" inputmode="numeric" placeholder="輸入金額">
            </div>
            <div class="field">
              <label for="multiplier">豐盛回向倍數</label>
              <select id="multiplier">
                <option value="1">1 倍 · 如常流動</option>
                <option value="2" selected>2 倍 · 雙倍回向</option>
                <option value="5">5 倍 · 豐盛擴大</option>
                <option value="10">10 倍 · 無限想像</option>
              </select>
            </div>
          </div>
          <div class="field">
            <label for="itemGratitude">感謝心語（選填）</label>
            <input type="text" id="itemGratitude" maxlength="240" placeholder="這筆花費帶給我什麼美好？">
          </div>
          <button class="primary" type="submit"><i data-lucide="sparkles" style="width:17px;height:17px"></i> 記下這份豐盛</button>
        </form>
      </section>

      <section class="panel">
        <div class="section-head history-head">
          <div>
            <h2>豐盛流動足跡</h2>
            <p class="section-sub">每一筆紀錄，都是生活的片刻。</p>
          </div>
          <button class="text-button" type="button" onclick="clearHistory()">清除紀錄</button>
        </div>
        <div id="transactionList" class="history-list"></div>
        <div id="emptyState" class="empty">還沒有紀錄<br>從上方記下一筆今天的美好吧。</div>
      </section>
    </main>
    <footer>錢不是不見了，只是轉化成你喜歡的生活體驗。<br>Universe Ledger · 你的豐盛日常</footer>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"><span id="toastMessage"></span></div>

  <script>
    lucide.createIcons();
    let transactions = JSON.parse(localStorage.getItem('universe_transactions')) || [];
    const quotes = [
      "每一筆支出，都是你體驗美好生活的印記。",
      "感謝金錢帶來的價值，也感謝自己好好生活。",
      "豐盛不只在金額裡，也在每一次真實的感受裡。",
      "你正在練習看見生活中已經擁有的美好。",
      "讓金錢安心流動，也讓感謝自然發生。"
    ];
    document.getElementById('abundanceQuote').textContent = quotes[Math.floor(Math.random()*quotes.length)];

    function showToast(message) {
      const toast = document.getElementById('toast');
      document.getElementById('toastMessage').textContent = message;
      toast.classList.add('show');
      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => toast.classList.remove('show'), 2800);
    }

    function handleAddTransaction(e) {
      e.preventDefault();
      const title = document.getElementById('itemTitle').value.trim();
      const baseAmount = Number(document.getElementById('itemAmount').value);
      const multiplier = Number(document.getElementById('multiplier').value);
      const gratitude = document.getElementById('itemGratitude').value.trim() || '感謝這份體驗為生活帶來的美好。';
      if (!title || !Number.isFinite(baseAmount) || baseAmount <= 0) return;
      const abundanceValue = baseAmount * multiplier;
      transactions.unshift({
        id: Date.now(), title, baseAmount, multiplier, abundanceValue, gratitude,
        date: new Date().toLocaleDateString('zh-TW', {month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})
      });
      saveAndRender();
      document.getElementById('abundanceForm').reset();
      document.getElementById('multiplier').value = '2';
      if (typeof confetti === 'function') confetti({particleCount:55, spread:58, origin:{y:.72}, colors:['#d9c28a','#a6d7c2','#718b7b']});
      showToast(`已記下這份豐盛：+ NT$ ${abundanceValue.toLocaleString()}`);
    }

    function deleteTransaction(id) {
      transactions = transactions.filter(tx => tx.id !== id);
      saveAndRender();
      showToast('已刪除這筆紀錄');
    }

    function clearHistory() {
      if (transactions.length && confirm('確定要清除所有豐盛紀錄嗎？此操作無法復原。')) {
        transactions = [];
        saveAndRender();
        showToast('紀錄已清空');
      }
    }

    function saveAndRender() {
      localStorage.setItem('universe_transactions', JSON.stringify(transactions));
      render();
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));
    }

    function render() {
      const list = document.getElementById('transactionList');
      const empty = document.getElementById('emptyState');
      let total = 0;
      list.innerHTML = '';
      empty.style.display = transactions.length ? 'none' : 'block';

      transactions.forEach(tx => {
        total += Number(tx.abundanceValue) || 0;
        const item = document.createElement('article');
        item.className = 'transaction';
        item.innerHTML = `
          <div class="tx-main">
            <div class="tx-title-row">
              <span class="tx-title">${escapeHtml(tx.title)}</span>
              <span class="tag">${Number(tx.multiplier)} 倍回向</span>
            </div>
            <p class="tx-gratitude">${escapeHtml(tx.gratitude)}</p>
            <span class="tx-date">${escapeHtml(tx.date)}</span>
          </div>
          <div class="tx-right">
            <div>
              <div class="tx-original">支出 NT$ ${Number(tx.baseAmount).toLocaleString()}</div>
              <div class="tx-value">+${Number(tx.abundanceValue).toLocaleString()}</div>
            </div>
            <button class="delete-btn" type="button" aria-label="刪除${escapeHtml(tx.title)}" onclick="deleteTransaction(${Number(tx.id)})"><i data-lucide="x" style="width:16px;height:16px"></i></button>
          </div>`;
        list.appendChild(item);
      });
      document.getElementById('totalAbundance').textContent = `NT$ ${total.toLocaleString()}`;
      document.getElementById('statCount').textContent = `${transactions.length} 筆`;
      lucide.createIcons();
    }
    render();
  </script>
</body>
</html>
